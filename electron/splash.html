<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Kairos (2026-10-06): the wordmark and the tagline over the cloud-ring
     sky, ink on parchment. Fonts and image are local: this shows before the
     backend is up. */
  @font-face{font-family:"Jost";src:url("fonts/Jost-Variable.woff2") format("woff2");font-weight:100 900}
  @font-face{font-family:"Cormorant Garamond";src:url("fonts/CormorantGaramond-Italic-Variable.woff2") format("woff2");font-weight:300 700;font-style:italic}
  html,body{height:100%;margin:0}
  body{
    background:#F3EADB url("splash-sky.jpg") center/cover;
    color:#3A2A20;font-family:"Jost","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;padding:0 48px;
  }
  .wordmark{width:min(340px,60vw);height:auto}
  .tagline{margin:0 0 8px;font-family:"Cormorant Garamond",Garamond,serif;font-style:italic;font-weight:500;font-size:22px}
  #msg{color:#6B5646;font-size:14px;max-width:520px;line-height:1.6;margin:0}
  #detail{color:#745F4D;font-size:12px;max-width:560px;line-height:1.6;margin:0;
          white-space:pre-wrap;word-break:break-word}
  .bar{width:200px;height:2px;border-radius:2px;background:rgba(184,137,59,.25);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#B8893B;border-radius:2px;
         animation:slide 1.6s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  @media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%;opacity:.5}}
  .err #msg{color:#A8432F}
  .err .bar{display:none}
</style>

<script>
  // Driven from the main process via executeJavaScript. A real file rather
  // than a data: URL — newer Electron restricts top-level data: navigation,
  // which silently left the window blank instead of showing this.
  window.setStatus = (msg, detail, isError) => {
    document.getElementById('msg').textContent = msg;
    document.getElementById('detail').textContent = detail || '';
    document.body.classList.toggle('err', !!isError);
  };
</script>
