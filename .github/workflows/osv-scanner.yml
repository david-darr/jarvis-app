name: OSV-Scanner

# Adapted from Hermes Agent's .github/workflows/osv-scanner.yml
# (https://github.com/NousResearch/hermes-agent), MIT License,
# Copyright (c) 2025 Nous Research. The permission notice is reproduced at
# the end of this file.
#
# Scans the lockfiles against the OSV vulnerability database, weekly and on
# demand. Detection only: it never opens PRs or changes a pin, and it does
# not fail on findings. It answers "has a version we already ship become
# known-vulnerable", which is the gap a hash-locked build leaves by design -
# the lock stops a new release getting in, so something has to say when an
# old one goes bad. Findings land in the repo's Security tab (Code scanning).
#
# The reusable workflow is pinned by commit SHA, like every action here.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  # Required to upload the SARIF results to code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      # Explicit lockfiles rather than a recursive scan, so vendored and
      # build-output directories are skipped. requirements.lock is in pip's
      # requirements format, which the prefix tells the scanner.
      scan-args: |-
        --lockfile=requirements.txt:requirements.lock
        --lockfile=package-lock.json
        --lockfile=electron/package-lock.json
      results-file-name: osv-results.sarif
      fail-on-vuln: false

